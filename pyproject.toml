[project]
name = "virtual-robot-arm"
version = "0.1.0"
description = "Simulateur MuJoCo du bras SO-101 pour apprendre la cinématique inverse et l'apprentissage par renforcement"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.2",
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
